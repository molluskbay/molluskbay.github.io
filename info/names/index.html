<!DOCTYPE html>
<html>
    <head>
        <title>みかんまりのページ | 自己紹介</title>
        <base href="../..">
        <link rel="icon" href="media/shellred.png">
        <meta name="viewport" content="width=device-width, initial-scale=1.0">
        <style>
            body {font-family:'courier new';text-align:left;margin-left: 100px;margin-top:100px;margin-right:100px;margin-bottom:100px;}
            a {text-decoration: none}

            p {color:#29A6A9}
            button {cursor:pointer; border:none; border-radius:50px; padding:5px 20px; font-family:'courier new';}
            div {
                margin-left: 25px;margin-top: 30px;
            }
        </style>
    </head>

    <body style="background-color:#202531">
        <p><a href="." style="color:#29A6A9">mollusca.ink/</a><a href="./info" style="color:#29A6A9">info/</a><a href="./info/names" style="color:#8BE2DA">names</a></p>
        <h1 style="color:#DF406D">自己紹介<br>about me</h1>
        <p><small>(† = extinct)</small></p>
        <div>
    <button onclick="readname()" style="color:#29A6A9;background-color:#2A3449"><i>[get another name]</i></button>

    <div id="names">
        <h1 style="color:#FF8E00; font-size:300%;"><b>mari</b></h1>
            </div>
        </div>

    <script>
        function readname() {
            fetch("info/names/names.txt")
                .then((response) => response.text())
                .then((text) => standsfor(text.split(/\r?\n/)))
        }
        function standsfor(n) {
            n = n[Math.floor(Math.random() * n.length)]
            document.getElementById("names").innerHTML = '<h1 style="color:#FF8E00; font-size:300%;"><b>'+ n +'</b></h1>'
        }
    </script>

    </body>
</html>
